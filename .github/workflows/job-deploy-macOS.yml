name: macOS Deploy Job

on:
  workflow_call:
    inputs:
      targetFramework:
        type: string
        required: true
      configuration:
        type: string
        default: 'Release'
      architecture:
        type: string
        default: 'x64'

jobs:
  deploy:
    name: deploy-macOS-${{ inputs.architecture }}-${{ inputs.configuration }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Build-macOS-${{ inputs.architecture }}-${{ inputs.configuration }}
          path: artifacts/macOS-${{ inputs.architecture }}

      - uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ inputs.architecture }}-${{ inputs.configuration }}
          if-no-files-found: error
          path: artifacts/macOS-${{ inputs.architecture }}
