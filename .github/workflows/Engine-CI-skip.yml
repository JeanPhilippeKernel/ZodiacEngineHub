name: Panzerfaust CI

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.cs'
      - '**.axaml'
      - '**.csproj'
      - '**.manifest'
      - '.github/workflows/**'

jobs:
  commitlint:
    if: github.base_ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No source changes — skipping commitlint"

  # Call reusable workflows with all options false so the nested check names
  # (e.g. "windows / build-release / build-windows-x64-Release") appear as
  # skipped — satisfying both develop's top-level and main's nested required checks.
  windows:
    uses: ./.github/workflows/windows-build.yml
    with:
      targetFramework: net10.0
      run_debug: false
      run_release: false
      run_deploy: false

  macOS:
    uses: ./.github/workflows/macOS-build.yml
    with:
      targetFramework: net10.0
      run_debug: false
      run_release: false
      run_deploy: false

  linux:
    uses: ./.github/workflows/linux-build.yml
    with:
      targetFramework: net10.0
      run_debug: false
      run_release: false
      run_deploy: false
