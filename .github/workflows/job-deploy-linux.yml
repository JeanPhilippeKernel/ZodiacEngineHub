name: Linux Deploy Job

on:
  workflow_call:
    inputs:
      targetFramework:
        type: string
        required: true
      configuration:
        type: string
        default: 'Release'

jobs:
  deploy:
    name: deploy-linux-x64-${{ inputs.configuration }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Build-linux-x64-${{ inputs.configuration }}
          path: artifacts/linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ inputs.configuration }}
          if-no-files-found: error
          path: artifacts/linux-x64
